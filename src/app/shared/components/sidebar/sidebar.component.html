<aside id="app-sidebar" aria-label="Primary">
  <div class="brand">
    <p class="mark">PG</p>
    <div>
      <p class="name">Personal Growth OS</p>
      <p class="tag">Direction over pressure</p>
    </div>
  </div>

  <nav>
    <ul>
      @for (item of items; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            ariaCurrentWhenActive="page"
            (click)="navigated.emit()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              @switch (item.icon) {
                @case ('home') {
                  <path d="M4 11 12 4l8 7v9H4z" />
                  <path d="M10 20v-6h4v6" />
                }
                @case ('target') {
                  <circle cx="12" cy="12" r="7" />
                  <circle cx="12" cy="12" r="3" />
                }
                @case ('calendar') {
                  <rect x="4" y="5" width="16" height="15" rx="2" />
                  <path d="M8 3v4M16 3v4M4 10h16" />
                }
                @case ('repeat') {
                  <path d="M17 7H8a4 4 0 0 0 0 8h9" />
                  <path d="m14 4 3 3-3 3" />
                  <path d="M7 17h9a4 4 0 0 0 0-8H7" />
                  <path d="m10 14-3 3 3 3" />
                }
                @case ('mind') {
                  <circle cx="12" cy="12" r="8" />
                  <path d="M9 12c.6-2 2.1-3 3-3s2.4 1 3 3c-.6 2-2.1 3-3 3s-2.4-1-3-3z" />
                }
                @case ('book') {
                  <path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v16H7.5A2.5 2.5 0 0 0 5 21.5z" />
                  <path d="M5 5.5A2.5 2.5 0 0 1 7.5 8H19" />
                }
                @case ('chart') {
                  <path d="M4 19V5M4 19h16" />
                  <path d="M8 15v-3M12 15V8M16 15v-5" />
                }
                @case ('journal') {
                  <rect x="5" y="3" width="14" height="18" rx="2" />
                  <path d="M9 8h6M9 12h6M9 16h4" />
                }
              }
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <p class="foot">Local-first. Missing a day does not erase progress.</p>
</aside>
